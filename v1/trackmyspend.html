<!doctype html>
<html lang="en" data-bs-theme="light">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Track My Spend</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"
        defer></script>
    <script src="https://cdn.jsdelivr.net/npm/countup.js@2.10.0/dist/countUp.umd.min.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.0/dist/chart.umd.min.js" defer></script>

    <style>
        html {
            font-size: 90%;
        }

        body {
            font-family: "Roboto", sans-serif;
            font-optical-sizing: auto;
        }

        #pieChartDiv {
            height: 250px;
            width: 250px;
            margin: auto;
        }

        #barChartDiv {
            height: 250px;
            width: 100%;
        }

        .cursor-pointer {
            cursor: pointer;
        }

        #usernameDisplay {
            text-transform: capitalize;
        }

        .hover-card {
            transition: all 0.25s ease;
        }

        .hover-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.15) !important;
        }

        .btn {
            transition: all 0.25s ease;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.15) !important;
        }

        .btn:active {
            transform: scale(0.96);
        }

        /* Common Hover Effect */
        .hover-effect {
            transition: all 0.25s ease;
        }

        .hover-effect:hover {
            transform: translateY(-2px);
            box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.15) !important;
        }

        .hover-effect:active {
            transform: scale(0.96);
        }
    </style>
</head>

<body>
    <nav class="navbar navbar-expand-lg bg-body-tertiary">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold" href="#" id="brandLogo">💰Track My Spend</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false"
                aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown">
                            💼Budget
                        </a>
                        <ul class="dropdown-menu">
                            <li>
                                <a class="dropdown-item" href="#" data-bs-toggle="modal" data-bs-target="#budgetModal">
                                    ➕Add
                                </a>
                            </li>
                            <li>
                                <button class="dropdown-item text-danger" id="deleteBudgetBtn">
                                    🗑️Delete
                                </button>
                            </li>
                        </ul>
                    </li>
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown">
                            📤Export
                        </a>
                        <ul class="dropdown-menu dropdown-menu-end shadow-sm">
                            <li>
                                <button class="dropdown-item" id="exportJsonBtn">
                                    📤Export JSON
                                </button>
                            </li>
                            <li>
                                <button class="dropdown-item" id="exportCsvBtn">
                                    📄Export CSV
                                </button>
                            </li>
                            <li>
                                <button class="dropdown-item" id="exportPdfBtn">
                                    📕Export PDF
                                </button>
                            </li>
                        </ul>
                    </li>
                    <li class="nav-item">
                        <label class="nav-link cursor-pointer mb-0">
                            📥Import
                            <input type="file" id="importJsonInput" accept=".json" hidden />
                        </label>
                    </li>
                </ul>
                <div class="mx-auto">
                    <input id="searchInput" type="text" class="form-control form-control-sm border border-success"
                        placeholder="🔍Search..." />
                </div>
                <div
                    class="ms-auto d-flex align-items-center gap-2 mt-2 mt-sm-0 justify-content-between justify-content-sm-start">
                    <button id="darkModeToggle" class="btn btn-sm btn-outline-primary fw-semibold rounded-pill px-2">
                        🌙Dark
                    </button>
                    <button id="navUsageBtn" class="btn btn-sm btn-outline-primary fw-semibold rounded-pill">
                        📊0% Used
                    </button>
                    <button id="userBtn" class="btn btn-sm fw-semibold rounded-pill btn-outline-success fw-semibold">
                        👤Hi,&nbsp;<span id="usernameDisplay"></span>
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <div class="container mt-3">
        <div class="row">
            <div class="col">
                <div class="card shadow-sm p-3 rounded-3 border-secondary">
                    <form id="transactionForm" class="row g-2 align-items-center" novalidate>

                        <div class="col-12 col-md">
                            <input id="amount" type="number"
                                class="form-control form-control-sm border border-secondary"
                                placeholder="💰Enter amount (₹)" min="0.01" step="0.1" required />
                        </div>

                        <div class="col-12 col-md">
                            <select id="type" class="form-select form-select-sm cursor-pointer border border-secondary"
                                required>
                                <option value="EXPENSE" selected>📉Expense</option>
                                <option value="INCOME" disabled>📈Income</option>
                            </select>
                        </div>

                        <div class="col-12 col-md">
                            <select class="form-select form-select-sm cursor-pointer border border-secondary"
                                id="category" required></select>
                        </div>

                        <div class="col-12 col-md">
                            <input id="date" type="date"
                                class="form-control form-control-sm cursor-pointer border border-secondary" lang="en-GB"
                                required />
                        </div>

                        <div class="col-12 col-md">
                            <input id="note" type="text" class="form-control form-control-sm border border-secondary"
                                placeholder="📝Add a note (optional)" maxlength="100" />
                        </div>

                        <div class="col-12 col-md d-flex gap-2">
                            <button id="submitTransactionBtn" class="btn btn-sm btn-primary w-100" type="submit">
                                Add
                            </button>
                            <button id="cancelEditBtn" class="btn btn-sm btn-secondary d-none" type="button">
                                Cancel
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
        <div class="row my-3">
            <div class="col-12 col-md mt-2 mt-md-0">
                <!-- TOP CARDS -->
                <div class="row g-2 mb-3">

                    <div class="col-6">
                        <div class="card p-2 shadow-sm rounded-3 hover-card border-secondary">
                            <div class="d-flex justify-content-between align-items-center">
                                <small class="fw-semibold">💰Budget</small>
                                <h4 class="mb-0" id="budgetValue">₹10,000</h4>
                            </div>
                        </div>
                    </div>

                    <div class="col-6">
                        <div class="card p-2 shadow-sm rounded-3 hover-card border-secondary">
                            <div class="d-flex justify-content-between align-items-center">
                                <small class="fw-semibold">💸Spent</small>
                                <h4 class="mb-0 text-danger" id="spentValue">₹6,500</h4>
                            </div>
                        </div>
                    </div>

                    <div class="col-6">
                        <div class="card p-2 shadow-sm rounded-3 hover-card border-secondary">
                            <div class="d-flex justify-content-between align-items-center">
                                <small class="fw-semibold">🟢Remaining</small>
                                <h4 class="mb-0 text-success" id="remainingValue">₹3,500</h4>
                            </div>
                        </div>
                    </div>

                    <div class="col-6">
                        <div class="card p-2 shadow-sm rounded-3 hover-card border-secondary">
                            <div class="d-flex justify-content-between align-items-center">
                                <small class="fw-semibold">📅Days Left</small>
                                <h4 class="mb-0" id="daysLeftValue">12</h4>
                            </div>
                        </div>
                    </div>

                    <div class="col-6">
                        <div class="card p-2 shadow-sm rounded-3 hover-card border-secondary">
                            <div class="d-flex justify-content-between align-items-center">
                                <small class="fw-semibold">💸You'll Get</small>
                                <h4 class="mb-0" id="youWillGetValue">₹0</h4>
                            </div>
                        </div>
                    </div>

                    <div class="col-6">
                        <div class="card p-2 shadow-sm rounded-3 hover-card border-secondary">
                            <div class="d-flex justify-content-between align-items-center">
                                <small class="fw-semibold">📥You'll Pay</small>
                                <h4 class="mb-0" id="youWillPayValue">₹0</h4>
                            </div>
                        </div>
                    </div>

                </div>

                <!-- PIE CHART -->
                <div class="card p-3 mb-3 shadow-sm rounded-3 border-secondary">
                    <small class="mb-2">📊Category Breakdown</small>
                    <div id="pieChartDiv">
                        <canvas id="pieChart"></canvas>
                    </div>
                </div>

                <!-- BAR CHART -->
                <!-- BAR CHART -->
                <div class="card p-3 shadow-sm rounded-3 border-secondary">

                    <div class="d-flex justify-content-between align-items-center mb-2">
                        <small>📈Spending Analytics</small>
                        <select id="chartViewType"
                            class="form-select form-select-sm w-auto cursor-pointer border border-secondary">
                            <option value="daily" selected>Daily</option>
                            <option value="weekly">Weekly</option>
                            <option value="monthly">Monthly</option>
                        </select>
                    </div>
                    <div id="barChartDiv">
                        <canvas id="barChart"></canvas>
                    </div>
                </div>
            </div>
            <div class="col-12 col-md">
                <div class="accordion" id="dateAccordion"></div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="budgetModal" tabindex="-1" data-bs-backdrop="static" data-bs-keyboard="false"
        aria-labelledby="budgetModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="budgetModalLabel">💼Budget Setup</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="budgetForm">
                        <div class="mb-3">
                            <label class="form-label" for="budgetAmount">💰Amount:</label>
                            <input type="number" id="budgetAmount" class="form-control form-control-sm"
                                placeholder="💰Enter total budget (₹)" step="0.1" required />
                        </div>
                        <div class="row g-2">
                            <div class="col-6">
                                <label class="form-label" for="startDate">📅From:</label>
                                <input type="date" id="startDate" class="form-control form-control-sm" lang="en-GB"
                                    required />
                            </div>

                            <div class="col-6">
                                <label class="form-label" for="endDate">🏁To:</label>
                                <input type="date" id="endDate" class="form-control form-control-sm" lang="en-GB"
                                    required />
                            </div>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                    <button type="submit" class="btn btn-primary" form="budgetForm">Save</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const emojis = Object.freeze(["💸", "💰", "📊", "🧾", "💳", "🪙", "📉", "🧮"]);
        const NO_DATA_TEXT = "📭 No chart data available";
        const STORAGE_KEY = "trackMySpendData";
        const DARK_MODE_KEY = "trackMySpendDarkMode";
        const elements = {

            // Inputs
            amountInput: document.getElementById("amount"),
            dateInput: document.getElementById("date"),
            noteInput: document.getElementById("note"),
            searchInput: document.getElementById("searchInput"),

            // Selects
            typeSelect: document.getElementById("type"),
            categorySelect: document.getElementById("category"),
            chartViewTypeSelect: document.getElementById("chartViewType"),

            // Forms
            transactionForm: document.getElementById("transactionForm"),
            budgetForm: document.getElementById("budgetForm"),

            // Buttons
            submitTransactionBtn: document.getElementById("submitTransactionBtn"),
            cancelEditBtn: document.getElementById("cancelEditBtn"),
            darkModeToggleBtn: document.getElementById("darkModeToggle"),
            exportJsonBtn: document.getElementById("exportJsonBtn"),
            exportCsvBtn: document.getElementById("exportCsvBtn"),
            exportPdfBtn: document.getElementById("exportPdfBtn"),
            navUsageBtn: document.getElementById("navUsageBtn"),
            userBtn: document.getElementById("userBtn"),

            // Charts
            pieChartCanvas: document.getElementById("pieChart"),
            barChartCanvas: document.getElementById("barChart"),

            // Containers
            dateAccordion: document.getElementById("dateAccordion"),

            // Modal
            budgetModal: document.getElementById("budgetModal"),

            // File Input
            importJsonInput: document.getElementById("importJsonInput"),
        };

        const storage = {
            save(key, value) {
                localStorage.setItem(key, JSON.stringify(value));
            },

            get(key, defaultValue = null) {
                const item = localStorage.getItem(key);

                if (!item) return defaultValue;

                try {
                    return JSON.parse(item);
                } catch (error) {
                    console.error("Invalid JSON in localStorage:", error);
                    return defaultValue;
                }
            },

            remove(key) {
                localStorage.removeItem(key);
            },

            clear() {
                localStorage.clear();
            },

            update(key, updaterFn) {
                const currentData = this.get(key);
                const updatedData = updaterFn(currentData);
                this.save(key, updatedData);
                return updatedData;
            }
        };

        let data = {
            budget: {
                id: null,
                amount: 0,
                startDate: null,
                endDate: null
            },
            categories: [
                "🍔 Food",
                "🛒 Groceries",
                "🏠 Rent",
                "🧾 Utilities",
                "💡 Electricity",
                "🚰 Water",
                "🌐 Internet",
                "🚌 Transport",
                "⛽ Fuel",
                "🛍️ Shopping",
                "👕 Clothing",
                "🎮 Entertainment",
                "📈 Investment",
                "🎬 Movies",
                "📺 Subscriptions",
                "🧘 Health",
                "💊 Medical",
                "🛡️ Insurance",
                "📚 Education",
                "✈️ Travel",
                "📄 Bills",
                "💳 EMI",
                "🏛️ Taxes",
                "🎁 Gifts",
                "🧴 Personal Care",
                "🤝 Borrow",
                "💸 Lend",
                "📦 Other",
            ],
            transactions: [],
        };

        let pieChartInstance = null;
        let barChartInstance = null;
        let editingTransactionId = null;
        let searchBuffer = "";
        let searchTimeout;

        document.addEventListener("DOMContentLoaded", () => {

            initDarkMode();

            loadData();

            document.getElementById("brandLogo").addEventListener("click", handleBrandLogoClick);
            elements.darkModeToggleBtn.addEventListener("click", toggleDarkMode);

            // Handle greeting
            handleUserGreeting();

            // Title update
            updateTitle();
            setInterval(updateTitle, 5000);

            // Budget
            const budgetModal = elements.budgetModal;
            budgetModal.addEventListener("shown.bs.modal", handleBudgetModalShown);
            budgetModal.addEventListener("show.bs.modal", handleBudgetModalShow);
            elements.budgetForm.addEventListener("submit", handleBudgetFormSubmit);
            document.getElementById("startDate").addEventListener("change", handleStartDateChange);
            document.getElementById("endDate").addEventListener("change", handleEndDateChange);
            document.getElementById("deleteBudgetBtn").addEventListener("click", deleteBudget);

            // Transaction
            initializeTransactionForm();
            elements.typeSelect.addEventListener("change", handleTypeChange);
            elements.categorySelect.addEventListener("change", handleCategoryChange);
            elements.transactionForm.addEventListener("submit", handleTransactionFormSubmit);
            elements.cancelEditBtn.addEventListener("click", cancelEditTransaction);

            elements.categorySelect.addEventListener("keydown", handleCategorySearch);

            // Search
            elements.searchInput.addEventListener("keyup", handleSearch);
            elements.userBtn.addEventListener("click", handleEditUsername);

            // Backup
            elements.exportJsonBtn.addEventListener("click", exportDataAsJson);
            elements.exportCsvBtn.addEventListener("click", exportDataAsCsv);
            elements.exportPdfBtn.addEventListener("click", exportDataAsPdf);
            elements.importJsonInput.addEventListener("change", importJsonFile);

            elements.chartViewTypeSelect.addEventListener("change", renderDailyChart);

            renderTransactions();
            updateDashboard();
            renderCategoryChart();
            renderDailyChart();
        });

        function handleBrandLogoClick(e) {
            e.preventDefault();
            location.reload();
        }

        function initDarkMode() {
            const saved = storage.get(DARK_MODE_KEY);
            const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
            const isDark = saved !== null ? saved === "dark" : prefersDark;

            applyTheme(isDark ? "dark" : "light");
        }

        function applyTheme(theme) {
            document.documentElement.setAttribute("data-bs-theme", theme);
            const isDark = theme === "dark";

            const toggleBtn = elements.darkModeToggleBtn;

            toggleBtn.textContent = isDark ? "☀️Light" : "🌙Dark";

            storage.save(DARK_MODE_KEY, theme);

            renderCategoryChart();
            renderDailyChart();
        }

        function toggleDarkMode() {
            const current = document.documentElement.getAttribute("data-bs-theme");
            applyTheme(current === "dark" ? "light" : "dark");
        }

        function deleteBudget() {

            if (!data.budget || !data.budget.amount) {
                alert("⚠️No active budget found");
                return;
            }

            const confirmed = confirm("⚠️Deleting the budget will also delete all transactions. Are you sure you want to proceed?");

            if (!confirmed) return;

            // Reset budget
            data.budget = {
                id: null,
                amount: 0,
                startDate: null,
                endDate: null
            };

            // Delete all transactions
            data.transactions = [];

            // Save changes
            saveData();

            // Reset UI
            initializeTransactionForm();

            renderTransactions();

            updateDashboard();
        }

        // user button click
        function handleEditUsername() {

            const key = "trackMyExpenseUsername";

            const currentName = storage.get(key, "user");

            const updatedName = prompt("Edit your name:", currentName);

            if (updatedName === null) return;

            const finalName = updatedName.trim() || "user";

            storage.save(key, finalName.toLowerCase());

            document.getElementById("usernameDisplay").textContent = finalName;
        }

        function handleCategoryChange(e) {

            const noteInput = elements.noteInput;

            // Don't overwrite existing custom text
            if (
                noteInput.value.trim() &&
                !noteInput.value.startsWith("Given to") &&
                !noteInput.value.startsWith("Borrowed from")
            ) {
                return;
            }

            if (e.target.value === "💸 Lend") {
                noteInput.value = "Given to ";
            }
            else if (e.target.value === "🤝 Borrow") {
                noteInput.value = "Borrowed from ";
            }
            else {
                noteInput.value = "";
            }
        }

        function handleTypeChange(e) {

            const category = elements.categorySelect;

            if (e.target.value === "INCOME") {
                category.disabled = true;
                category.required = false;
                category.value = "";
            } else {
                category.disabled = false;
                category.required = true;
            }
        }

        function handleBudgetFormSubmit(e) {
            e.preventDefault();
            saveBudget();
            updateDashboard("budget");
            bootstrap.Modal.getInstance(elements.budgetModal).hide();
        }

        function handleBudgetModalShown() {
            document.getElementById("budgetAmount").focus();
        }

        function handleBudgetModalShow(e) {
            const existingBudget = data.budget;
            if (
                existingBudget &&
                existingBudget.amount > 0 &&
                existingBudget.startDate &&
                existingBudget.endDate
            ) {
                alert("⚠️A budget is already active. You can create a new one after it ends.");
                e.preventDefault();
                return;
            }

            resetBudgetForm();
        }

        function handleUserGreeting() {
            const key = "trackMyExpenseUsername";
            let username = storage.get(key);

            if (!username) {
                username = prompt("Enter your name:");

                if (!username || !username.trim()) {
                    username = "user";
                }

                username = username.trim().toLowerCase();

                storage.save(key, username);
            }

            document.getElementById("usernameDisplay").textContent = username;
        }

        function updateTitle() {
            const [emoji1, emoji2] = [...emojis]
                .sort(() => 0.5 - Math.random())
                .slice(0, 2);

            document.title = `${emoji1} Track My Spend ${emoji2}`;
        }

        function saveBudget() {

            if (isBudgetActive()) {
                alert("⚠️Active budget already exists!");
                return;
            }

            const amount = parseAmount(document.getElementById("budgetAmount").value);
            const startDate = document.getElementById("startDate").value;
            const endDate = document.getElementById("endDate").value;

            if (!amount || !startDate || !endDate) {
                alert("⚠️Please fill all fields");
                return;
            }

            if (new Date(endDate) < new Date(startDate)) {
                alert("❌End date cannot be before start date");
                return;
            }

            data.budget = {
                id: generateBudgetId(startDate, endDate),
                amount,
                startDate,
                endDate
            };

            saveData();

            initializeTransactionForm();
        }

        function resetBudgetForm() {
            const form = elements.budgetForm;
            const startDate = document.getElementById("startDate");
            const endDate = document.getElementById("endDate");

            if (!form) return;

            form.reset();

            if (startDate) startDate.min = "";
            if (endDate) endDate.min = "";
        }

        function initializeTransactionForm() {
            const categorySelect = elements.categorySelect;
            const dateInput = elements.dateInput;
            const type = elements.typeSelect.value;

            // Categories
            categorySelect.innerHTML = '<option value="" disabled selected hidden>📂Select Category</option>';
            categorySelect.innerHTML += [...data.categories]
                .sort((a, b) => {
                    const textA = a.split(" ")[1];
                    const textB = b.split(" ")[1];

                    return textA.localeCompare(textB);
                })
                .map(cat => `<option value="${cat}">${cat}</option>`)
                .join("");

            // Defaults
            elements.amountInput.value = "";
            elements.noteInput.value = "";

            const today = new Date().toISOString().split("T")[0];

            // Budget logic
            if (data.budget.startDate && data.budget.endDate) {

                dateInput.min = data.budget.startDate;
                dateInput.max = data.budget.endDate;

                // If today is inside budget range
                if (
                    today >= data.budget.startDate &&
                    today <= data.budget.endDate
                ) {
                    dateInput.value = today;
                } else {
                    // Otherwise select budget start date
                    dateInput.value = data.budget.startDate;
                }

            } else {
                // No budget created
                dateInput.min = "";
                dateInput.max = "";
                dateInput.value = today;
            }

            categorySelect.disabled = type === "INCOME";
            editingTransactionId = null;
        }

        function handleCategorySearch(e) {

            // Ignore special keys
            if (e.key.length !== 1) return;

            searchBuffer += e.key.toLowerCase();

            clearTimeout(searchTimeout);

            searchTimeout = setTimeout(() => {
                searchBuffer = "";
            }, 1000);

            const option = [...e.target.options].find(opt => {
                const text = opt.text.split(" ")[1]?.toLowerCase();
                return text?.startsWith(searchBuffer);
            });

            if (option) {
                e.target.value = option.value;
                e.target.dispatchEvent(
                    new Event("change")
                );
            }
        }

        function handleStartDateChange() {

            const fromInput = document.getElementById("startDate");
            const toInput = document.getElementById("endDate");

            if (!fromInput.value) return;

            const fromDate = new Date(fromInput.value);

            const toDate = new Date(fromDate);

            toDate.setDate(toDate.getDate() + 30);

            // Format YYYY-MM-DD
            const formattedTo = toDate.toISOString().split("T")[0];

            toInput.value = formattedTo;

            toInput.min = fromInput.value;
        }

        function handleEndDateChange() {

            const fromInput = document.getElementById("startDate");
            const toInput = document.getElementById("endDate");

            if (toInput.value < fromInput.value) {

                alert("❌To date cannot be before From date");

                toInput.value = "";
            }
        }

        function handleTransactionFormSubmit(e) {
            e.preventDefault();

            if (!data.budget.startDate || !data.budget.endDate) {
                alert("⚠️Please create a budget before adding transactions.");
                return;
            }

            const amount = parseAmount(elements.amountInput.value);
            const type = elements.typeSelect.value;
            const category = elements.categorySelect.value;
            const date = elements.dateInput.value;
            const note = elements.noteInput.value.trim();

            const errors = [
                (Number.isNaN(amount) || amount <= 0) && "Please enter a valid amount",
                !type && "Please select transaction type",
                (type === "EXPENSE" && !category) && "Please select a category",
                !date && "Please select a date",
                note.length > 100 && "Note must not exceed 100 characters",
            ].filter(Boolean);

            if (errors.length) {
                alert("⚠️Please fix the following:\n\n• " + errors.join("\n• "));
                return;
            }

            if (editingTransactionId) {

                const existingTxn = data.transactions.find(t => t.id === editingTransactionId);

                if (existingTxn) {

                    existingTxn.amount = amount;
                    existingTxn.type = type;
                    existingTxn.category = type === "INCOME" ? null : category;
                    existingTxn.date = date;
                    existingTxn.note = note;

                }

                editingTransactionId = null;

                elements.submitTransactionBtn.textContent = "Add";
                elements.cancelEditBtn.classList.add("d-none");

            } else {

                const transaction = {
                    id: crypto.randomUUID(),
                    amount,
                    type,
                    category: type === "INCOME" ? null : category,
                    date,
                    note,
                    createdAt: new Date().toISOString(),
                };

                data.transactions.push(transaction);
            }
            saveData();

            if (category === "🤝 Borrow") {
                updateDashboard("borrow");
            }
            else if (category === "💸 Lend") {
                updateDashboard("lend");
            }
            else {
                updateDashboard("expense");
            }

            initializeTransactionForm();
            renderTransactions();

        }

        function renderTransactions(transactions = data.transactions) {
            const accordion = elements.dateAccordion;
            accordion.textContent = "";

            if (!transactions.length) {
                accordion.innerHTML = `<div class="text-center text-muted p-3">📭No transactions yet</div>`;
                return;
            }

            const grouped = transactions.reduce((acc, txn) => {
                const date = txn.date;

                if (!acc[date]) {
                    acc[date] = [];
                }

                acc[date].push(txn);

                return acc;
            }, {});

            Object.keys(grouped)
                .sort((a, b) => new Date(b) - new Date(a))
                .forEach((date, index) => {
                    const collapseId = `date-${index}`;

                    const formattedDate = new Date(date).toLocaleDateString("en-GB", {
                        day: "2-digit",
                        month: "long",
                        year: "numeric"
                    });

                    const transactionsHTML = grouped[date]
                        .sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt))
                        .map(createTransactionItem)
                        .join("");

                    const totalAmount = grouped[date]
                        .reduce((sum, txn) => sum + txn.amount, 0);

                    const totalCount = grouped[date].length;

                    accordion.insertAdjacentHTML("beforeend", `
                <div class="accordion-item">
                    <h2 class="accordion-header">
                    <button class="accordion-button collapsed fw-bold p-3"
                        type="button"
                        data-bs-toggle="collapse"
                        data-bs-target="#${collapseId}">

                        <div class="w-100 d-flex justify-content-between align-items-center">

                            <!-- LEFT -->
                            <div>
                                <div>📅${formattedDate}</div>
                                <small class="text-muted">${totalCount} transactions</small>
                            </div>

                            <!-- RIGHT -->
                            <div class="text-danger fw-semibold text-end">
                                ₹${formatAmount(totalAmount)}
                            </div>

                        </div>

                    </button>
                </h2>

                    <div id="${collapseId}" class="accordion-collapse collapse"
                        data-bs-parent="#dateAccordion">
                        <div class="accordion-body p-0">
                            <div class="list-group list-group-flush">
                                ${transactionsHTML}
                            </div>
                        </div>
                    </div>
                </div>
            `);
                });
        }

        function createTransactionItem(txn) {

            const isIncome = txn.type === "INCOME";
            const isBorrow = txn.category === "🤝 Borrow";
            const isLend = txn.category === "💸 Lend";

            return `
            <div class="list-group-item d-flex justify-content-between align-items-start ${isBorrow ? "bg-warning-subtle" : isLend ? "bg-info-subtle" : isIncome ? "bg-success-subtle" : "bg-danger-subtle"}">

            <div>
                <div>${txn.category || "💰 Income"}</div>
                ${txn.note
                    ? `<div class="text-muted small mt-1">📝 ${txn.note}</div>`
                    : ""
                }
            </div>

            <div class="text-end">

                <div class="${isIncome ? "text-success" : "text-danger"} fw-bold mb-2">
                    ${isIncome ? "+" : "-"} ₹${formatAmount(txn.amount)}
                </div>

                <div class="btn-group btn-group-sm">
                    <button
                        class="btn btn-outline-primary"
                        onclick="editTransaction('${txn.id}')">

        function deleteTransaction(id) {

            const confirmed = confirm("Are you sure you want to delete this transaction?");

            if (!confirmed) return;

            data.transactions = data.transactions.filter(txn => txn.id !== id);

            saveData();

            updateDashboard();
            renderTransactions();
        }

        function editTransaction(id) {

            const txn = data.transactions.find(t => t.id === id);

            if (!txn) return;

            editingTransactionId = id;

            elements.amountInput.value = txn.amount;
            elements.typeSelect.value = txn.type;

            elements.typeSelect.dispatchEvent(new Event("change"));
            elements.categorySelect.value = txn.category || "";
            elements.dateInput.value = txn.date;
            elements.noteInput.value = txn.note;

            elements.submitTransactionBtn.textContent = "Update";
            elements.cancelEditBtn.classList.remove("d-none");

            window.scrollTo({
                top: 0,
                behavior: "smooth"
            });

        function generateBudgetId(startDate, endDate) {
            // Format: YYYYMMDD
            const from = startDate.replaceAll("-", "");
            const to = endDate.replaceAll("-", "");

            return `BUD-${from}-${to}`;
        }

        function isBudgetActive() {
            return !!(
                data.budget &&
                data.budget.amount > 0 &&
                data.budget.startDate &&
                data.budget.endDate
            );
        }

        function animateDashboard({ budget, spent, remaining, daysLeft }) {

            const options = {
                duration: 1.5,
                separator: ",",
                decimalPlaces: 1,
                prefix: "₹"
            };

            new countUp.CountUp("budgetValue", budget, options).start();
            new countUp.CountUp("spentValue", spent, options).start();
            new countUp.CountUp("remainingValue", remaining, options).start();

            new countUp.CountUp("daysLeftValue", daysLeft, {
                duration: 1.2
            }).start();
        }

        function updateDashboard(trigger = "all") {
            const budget = data.budget.amount || 0;

            const spent = data.transactions.filter(isRealExpense).reduce((sum, t) => sum + t.amount, 0);

            const remaining = budget - spent;

            let daysLeft = 0;
            if (data.budget.startDate && data.budget.endDate) {
                const start = new Date(data.budget.startDate);
                const end = new Date(data.budget.endDate);
                daysLeft = Math.ceil(
                    (end - start) / (1000 * 60 * 60 * 24)
                );
            }

            const percent = budget > 0 ? Math.min((spent / budget) * 100, 100) : 0;

            let usageEmoji = "😎";

            if (percent >= 80) {
                usageEmoji = "💀";
            } else if (percent >= 50) {
                usageEmoji = "😟";
            }

            const navUsageBtn = elements.navUsageBtn;

            navUsageBtn.textContent = `${usageEmoji} ${percent.toFixed(1)}% Used`;

            navUsageBtn.classList.remove(
                "btn-outline-success",
                "btn-outline-warning",
                "btn-outline-danger",
                "btn-outline-primary"
            );

            if (percent < 50) {
                navUsageBtn.classList.add("btn-outline-success");
            }
            else if (percent < 80) {
                navUsageBtn.classList.add("btn-outline-warning");
            }
            else {
                navUsageBtn.classList.add("btn-outline-danger");
            }

            const youWillGet = data.transactions.filter(t => t.category === "💸 Lend").reduce((sum, t) => sum + t.amount, 0);
            const youWillPay = data.transactions.filter(t => t.category === "🤝 Borrow").reduce((sum, t) => sum + t.amount, 0);

            document.getElementById("youWillGetValue").textContent = `₹${formatAmount(youWillGet)}`;
            document.getElementById("youWillPayValue").textContent = `₹${formatAmount(youWillPay)}`;

            if (trigger === "budget") {
                animateCountUpValue("budgetValue", budget);
                animateCountUpValue("remainingValue", remaining);
                animateCountUpValue("daysLeftValue", daysLeft, false);
            }
            else if (trigger === "expense") {
                animateCountUpValue("spentValue", spent);
                animateCountUpValue("remainingValue", remaining);
            }
            else if (trigger === "borrow") {
                animateCountUpValue("youWillPayValue", youWillPay);
            }
            else if (trigger === "lend") {
                animateCountUpValue("youWillGetValue", youWillGet);
            }
            else {
                animateCountUpValue("budgetValue", budget);
                animateCountUpValue("spentValue", spent);
                animateCountUpValue("remainingValue", remaining);
                animateCountUpValue("daysLeftValue", daysLeft, false);
                animateCountUpValue("youWillGetValue", youWillGet);
                animateCountUpValue("youWillPayValue", youWillPay);
            }

            renderCategoryChart();

            renderDailyChart();

        }

        function renderCategoryChart() {

            const ctx = elements.pieChartCanvas;

            const expenseTxns = data.transactions.filter(isRealExpense);

            if (pieChartInstance) {
                pieChartInstance.destroy();
            }

            if (!expenseTxns.length) {
                pieChartInstance = renderEmptyChart(ctx, "pie");
                return;
            }

            const categoryMap = expenseTxns.reduce((acc, txn) => {
                acc[txn.category] = (acc[txn.category] || 0) + txn.amount;
                return acc;
            }, {});

            const labels = Object.keys(categoryMap);
            const values = Object.values(categoryMap);

            const colors = labels.map(() =>
                `hsl(${Math.random() * 360}, 70%, 60%)`
            );

            pieChartInstance = new Chart(ctx, {
                type: "pie",
                data: {
                    labels,
                    datasets: [{
                        data: values,
                        backgroundColor: colors,
                        borderWidth: 1,
                        hoverOffset: 20
                    }]
                },
                options: {
                    animation: {
                        animateRotate: true,
                        duration: 800
                    }
                }
            });
        }

        function renderDailyChart() {

            const ctx = elements.barChartCanvas;

            if (barChartInstance) {
                barChartInstance.destroy();
            }

            const expenseTransactions =
                data.transactions.filter(isRealExpense);

            if (!expenseTransactions.length) {

                barChartInstance = renderEmptyChart(ctx, "bar");

                return;
            }

            const viewType = elements.chartViewTypeSelect.value;

            const groupedData = {};

            expenseTransactions.forEach(txn => {

                const txnDate = new Date(txn.date);

                let key = "";

                // DAILY
                if (viewType === "daily") {
                    key = txn.date;
                }

                // WEEKLY
                else if (viewType === "weekly") {

                    const firstDay = new Date(txnDate);

                    firstDay.setDate(
                        txnDate.getDate() - txnDate.getDay()
                    );

                    key = firstDay.toISOString().split("T")[0];
                }

                // MONTHLY
                else if (viewType === "monthly") {

                    key = `${txnDate.getFullYear()}-${String(
                        txnDate.getMonth() + 1
                    ).padStart(2, "0")}`;
                }

                groupedData[key] = parseAmount((groupedData[key] || 0) + txn.amount);
            });

            const labels = Object.keys(groupedData);
            const values = Object.values(groupedData);
            const formattedLabels = labels.map(label => {

                // DAILY
                if (viewType === "daily") {
                    return new Date(label).toLocaleDateString(
                        "en-GB",
                        {
                            day: "2-digit",
                            month: "short"
                        }
                    );
                }

                // WEEKLY
                if (viewType === "weekly") {

                    return `Week of ${new Date(label)
                        .toLocaleDateString("en-GB", {
                            day: "2-digit",
                            month: "short"
                        })}`;
                }

                // MONTHLY
                return new Date(label + "-01")
                    .toLocaleDateString("en-GB", {
                        month: "short",
                        year: "numeric"
                    });
            });

            barChartInstance = new Chart(ctx, {

                type: "bar",

                data: {
                    labels: formattedLabels,

                    datasets: [{
                        label: "Spend (₹)",
                        data: values,
                        borderWidth: 1
                    }]
                },

                options: {
                    responsive: true,
                    maintainAspectRatio: false,

                    scales: {
                        y: {
                            beginAtZero: true
                        }
                    }
                }
            });
        }

        function handleSearch() {

            const keyword = elements.searchInput.value.toLowerCase().trim();

            // If empty -> show all
            if (!keyword) {
                renderTransactions(data.transactions);
                return;
            }

            const filteredTransactions = data.transactions.filter(txn => {
                return (
                    txn.category?.toLowerCase().includes(keyword) ||
                    txn.note?.toLowerCase().includes(keyword) ||
                    txn.type?.toLowerCase().includes(keyword) ||
                    txn.amount.toString().includes(keyword) ||
                    txn.date.includes(keyword)
                );

            });

            renderTransactions(filteredTransactions);
        }

            return new Chart(ctx, {
                type,
                data: {
                    labels: [],
                    datasets: []
                },
                options: {
                    plugins: {
                        legend: {
                            display: false
                        }
                    }
                },
                plugins: [{

        function exportDataAsJson() {
            const jsonString = JSON.stringify(data, null, 2);
            const blob = new Blob(
                [jsonString],
                { type: "application/json" }
            );

            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");

            a.href = url;
            a.download = `track-my-spend-${today}.json`;

        function importJsonFile(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function (event) {
                try {
                    const importedData = JSON.parse(event.target.result);
                    // Basic validation
                    if (
                        !importedData.budget ||
                        !Array.isArray(importedData.transactions)
                    ) {
                        throw new Error("Invalid backup file");
                    }
                    const confirmed = confirm("Importing will overwrite current data. Continue?");

                    if (!confirmed) return;

                    data = importedData;

                    saveData();

                    initializeTransactionForm();
                    renderTransactions();
                    updateDashboard();

                    alert("✅Data imported successfully");

                } catch (error) {
                    console.error(error);
                    alert("❌Invalid JSON backup file");
                }

            };

            reader.readAsText(file);

            // Reset input
            e.target.value = "";
        }

        function exportDataAsCsv() {

            if (!data.transactions.length) {
                alert("⚠️No transactions to export.");
                return;
            }

            const username = storage.get("trackMyExpenseUsername", "User");

            const today = new Date().toLocaleDateString("en-GB", {
                day: "2-digit",
                month: "long",
                year: "numeric"
            });

            // CSV Headers
            const headers = [
                "Date",
                "Type",
                "Category",
                "Amount (₹)",
                "Note",
            ];

            // Escape CSV values
            const escape = (val) => {

                if (val === null || val === undefined) {
                    return "";
                }

                const str = String(val);

                if (
                    str.includes(",") ||
                    str.includes('"') ||
                    str.includes("\n")
                ) {
                    return '"' + str.replace(/"/g, '""') + '"';
                }

                return str;
            };

            // Transaction Rows
            const rows = [...data.transactions]
                .sort((a, b) => new Date(a.date) - new Date(b.date))
                .map(txn => [
                    escape(txn.date),
                    escape(txn.type),
                    escape(txn.category || "Income"),
                    escape(txn.amount),
                    escape(txn.note),
                ]);

            // Summary
            const totalExpenses = data.transactions.filter(isRealExpense).reduce((sum, t) => sum + t.amount, 0);
            const totalBorrow = data.transactions.filter(t => t.category === "🤝 Borrow").reduce((sum, t) => sum + t.amount, 0);
            const totalLend = data.transactions.filter(t => t.category === "💸 Lend").reduce((sum, t) => sum + t.amount, 0);
            const remaining = (data.budget.amount || 0) - totalExpenses;

            // Metadata + Report Header
            const metadataRows = [
                ["💰 TRACK MY SPEND REPORT"],
                [],
                ["Name", escape(username)],
                ["Generated On", escape(today)],
                [],
                ["Budget Details"],
                ["Budget Amount", `₹${escape(data.budget.amount || 0)}`],
                ["Budget Start", escape(data.budget.startDate || "-")],
                ["Budget End", escape(data.budget.endDate || "-")],
                ["Total Spent", `₹${escape(totalExpenses)}`],
                ["Remaining", `₹${escape(remaining)}`],
                ["You'll Get", `₹${escape(totalLend)}`],
                ["You'll Pay", `₹${escape(totalBorrow)}`],
                [],
                ["TRANSACTION DETAILS"],
            ];

            // Footer
            const footerRows = [
                [],
                ["© 2026 💰Track My Spend"]
            ];

            // Final CSV
            const csvContent = [
                ...metadataRows.map(r => r.join(",")),
                headers.join(","),
                ...rows.map(r => r.join(",")),
                ...footerRows.map(r => r.join(","))
            ].join("\n");

            // Download
            const blob = new Blob(
                ["\uFEFF" + csvContent],
                { type: "text/csv;charset=utf-8;" }
            );

            const url = URL.createObjectURL(blob);

            const a = document.createElement("a");

            a.href = url;

            a.download =
                `track-my-spend-${new Date().toISOString().split("T")[0]}.csv`;

            document.body.appendChild(a);

            a.click();

            document.body.removeChild(a);

            URL.revokeObjectURL(url);
        }

          table { width: 100%; border-collapse: collapse; }
          thead th { background: #198754; color: #fff; padding: 7px 10px; text-align: left; font-size: 11px; }
          tbody tr:nth-child(even) { background: #f8f9fa; }
          tbody td { padding: 6px 10px; border-bottom: 1px solid #e9ecef; vertical-align: top; }
          .footer { margin-top: 24px; text-align: center; color: #adb5bd; font-size: 10px; }
          @media print {
            body { padding: 0; }
            @page { margin: 20mm; }
          }
        </style>
        </head>
        <body>
          <h1>💰 Track My Spend</h1>
          <div class="subtitle">Expense Report &nbsp;|&nbsp; Generated on ${today}${data.budget.startDate ? `&nbsp;|&nbsp; Budget period: ${data.budget.startDate} to ${data.budget.endDate}` : ""}</div>
        
          <div class="summary-grid">
            <div class="summary-card">
              <div class="label">💰 Budget</div>
              <div class="value">₹${(data.budget.amount || 0).toLocaleString()}</div>
            </div>
            <div class="summary-card">
              <div class="label">💸 Total Spent</div>
              <div class="value red">₹${totalExpenses.toLocaleString()}</div>
            </div>
            <div class="summary-card">
              <div class="label">🟢 Remaining</div>
              <div class="value green">₹${remaining.toLocaleString()}</div>
            </div>
            <div class="summary-card">
              <div class="label">📊 Usage</div>
              <div class="value">${data.budget.amount > 0 ? Math.min(100, ((totalExpenses / data.budget.amount) * 100)).toFixed(1) : "0"}%</div>
            </div>
            <div class="summary-card">
              <div class="label">📅 Transactions</div>
              <div class="value">${data.transactions.length}</div>
            </div>
            <div class="summary-card">
              <div class="label">💸 You'll Get</div>
              <div class="value green">₹${totalLend.toLocaleString()}</div>
            </div>
            <div class="summary-card">
              <div class="label">📥 You'll Pay</div>
              <div class="value red">₹${totalBorrow.toLocaleString()}</div>
            </div>
          </div>
        
          <h2>Transaction Details</h2>
          <table>
            <thead>
              <tr>
        <th style="width:15%">Date</th>
        <th style="width:30%">Category</th>
        <th style="width:15%; text-align:right">Amount</th>
        <th style="width:40%">Note</th>
              </tr>
            </thead>
            <tbody>
              ${transactionRowsHtml}
            </tbody>
          </table>
        
          <div class="footer">Track My Spend &mdash; Personal Budget Tracker</div>
          <script>window.onload = () => { window.print(); }<\/script>
        </body>
        </html>`;

            const blob = new Blob([html], { type: "text/html;charset=utf-8;" });
            const url = URL.createObjectURL(blob);
            const win = window.open(url, "_blank");

            if (!win) {
                alert("⚠️ Pop-up blocked. Please allow pop-ups and try again.");
            }

            setTimeout(() => URL.revokeObjectURL(url), 10000);
        }

        function saveData() {
            storage.save(STORAGE_KEY, data);
        }

        function loadData() {
            const savedData = storage.get(STORAGE_KEY);
            if (!savedData) return;
            data = savedData;
        }

        function formatAmount(value) {
            return Number(value || 0).toFixed(1);
        }

        function parseAmount(value) {
            const num = parseFloat(value);
            return Number.isNaN(num) ? 0 : Number(num.toFixed(1));
        }
    </script>
</body>
